<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - UserApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        dark: {
                            900: '#0a0a0a',
                            800: '#1a1a1a',
                            700: '#2a2a2a',
                            600: '#3a3a3a',
                            500: '#4a4a4a',
                        },
                        glass: 'rgba(18, 18, 18, 0.75)'
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out',
                        'slide-down': 'slideDown 0.5s ease-out',
                        'slide-up': 'slideUp 0.8s ease-out',
                        'gradient-shift': 'gradientShift 8s ease-in-out infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideDown: {
                            '0%': { transform: 'translateY(-10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        },
                        gradientShift: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-8px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: rgba(255, 255, 255, 0.92);
        }

        .gradient-bg {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
        }

        .glass-effect {
            background: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        .btn-hover:hover {
            transform: translateY(-1px);
        }

        .auth-logo {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(168, 85, 247, 0.2) 100%);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .password-strength {
            height: 4px;
            transition: all 0.3s ease;
        }

        .password-strength-weak {
            background: linear-gradient(to right, #ef4444, #f87171);
        }

        .password-strength-moderate {
            background: linear-gradient(to right, #f59e0b, #fbbf24);
        }

        .password-strength-strong {
            background: linear-gradient(to right, #10b981, #34d399);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
<div class="max-w-md w-full mx-auto animate-slide-up">
    <div class="glass-effect rounded-2xl p-8">
        <div class="flex flex-col items-center mb-8">
            <div class="w-16 h-16 auth-logo rounded-2xl flex items-center justify-center mb-4 animate-float">
                <svg class="w-8 h-8 text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2 text-center">Join UserApp</h1>
            <p class="text-white text-opacity-80 text-center">Create your account in seconds</p>
        </div>

        <form id="signupForm" class="space-y-6">
            <div>
                <label for="name" class="block text-white text-opacity-60 text-sm font-medium mb-2">Full Name</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-white text-opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                    <input
                            type="text"
                            id="name"
                            name="name"
                            required
                            class="pl-10 w-full px-4 py-3 rounded-xl bg-white bg-opacity-10 border border-white border-opacity-5 text-white placeholder-white placeholder-opacity-60 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-opacity-50 transition-all duration-300 input-focus"
                            placeholder="Enter your full name"
                    >
                </div>
                <p id="nameError" class="hidden text-red-300 text-sm mt-1"></p>
            </div>

            <div>
                <label for="username" class="block text-white text-opacity-60 text-sm font-medium mb-2">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-white text-opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
                        </svg>
                    </div>
                    <input
                            type="text"
                            id="username"
                            name="username"
                            required
                            class="pl-10 w-full px-4 py-3 rounded-xl bg-white bg-opacity-10 border border-white border-opacity-5 text-white placeholder-white placeholder-opacity-60 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-opacity-50 transition-all duration-300 input-focus"
                            placeholder="Choose a username"
                    >
                </div>
                <p id="usernameError" class="hidden text-red-300 text-sm mt-1"></p>
            </div>

            <div>
                <label for="email" class="block text-white text-opacity-60 text-sm font-medium mb-2">Email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-white text-opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            class="pl-10 w-full px-4 py-3 rounded-xl bg-white bg-opacity-10 border border-white border-opacity-5 text-white placeholder-white placeholder-opacity-60 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-opacity-50 transition-all duration-300 input-focus"
                            placeholder="Enter your email"
                    >
                </div>
                <p id="emailError" class="hidden text-red-300 text-sm mt-1"></p>
            </div>

            <div>
                <label for="password" class="block text-white text-opacity-60 text-sm font-medium mb-2">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-white text-opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                    </div>
                    <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            class="pl-10 w-full px-4 py-3 rounded-xl bg-white bg-opacity-10 border border-white border-opacity-5 text-white placeholder-white placeholder-opacity-60 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-opacity-50 transition-all duration-300 input-focus"
                            placeholder="Create a password"
                    >
                </div>
                <div class="mt-2">
                    <div id="passwordStrengthBar" class="password-strength password-strength-weak rounded-full"></div>
                    <p id="passwordStrengthText" class="text-xs text-white text-opacity-60 mt-1">Password strength: Weak</p>
                </div>
                <p id="passwordError" class="hidden text-red-300 text-sm mt-1"></p>
            </div>

            <div class="flex items-start">
                <div class="flex items-center h-5">
                    <input id="terms" name="terms" type="checkbox" class="h-4 w-4 bg-white bg-opacity-10 border border-white border-opacity-20 rounded focus:ring-primary-500 focus:ring-opacity-50" required>
                </div>
                <div class="ml-3 text-sm">
                    <label for="terms" class="text-white text-opacity-80">I agree to the <a href="#" class="text-primary-400 hover:text-primary-300">Terms of Service</a> and <a href="#" class="text-primary-400 hover:text-primary-300">Privacy Policy</a></label>
                </div>
            </div>

            <button
                    type="submit"
                    id="signupBtn"
                    class="w-full bg-gradient-to-r from-primary-500 to-purple-500 text-white py-3 px-4 rounded-xl font-medium hover:opacity-90 transition-all duration-300 btn-hover flex justify-center items-center"
            >
                Create Account
                <span id="signupLoading" class="hidden ml-2">
                    <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </span>
            </button>
        </form>

        <div class="mt-8 text-center text-white text-opacity-80">
            Already have an account? <a href="/signin" class="text-primary-400 hover:text-primary-300 font-medium">Sign in</a>
        </div>
    </div>
</div>

<div id="messageContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>

<script>
    $(document).ready(function() {
        const API_BASE_URL = 'http://localhost:8080/api/users';

        function showMessage(message, type = 'success') {
            const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            const icon = type === 'success' ?
                '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>' :
                '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>';

            const messageElement = $(`
                    <div class="message-alert ${bgColor} bg-opacity-90 text-white px-4 py-3 rounded-lg shadow-lg flex items-center animate-slide-down border border-white border-opacity-20">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            ${icon}
                        </svg>
                        <span>${message}</span>
                        <button class="ml-4 hover:text-opacity-80">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                `);

            $('#messageContainer').append(messageElement);

            setTimeout(() => {
                messageElement.fadeOut(() => messageElement.remove());
            }, 5000);

            messageElement.find('button').click(() => {
                messageElement.fadeOut(() => messageElement.remove());
            });
        }

        $('#signupForm').submit(function(e) {
            e.preventDefault();
            $('#nameError').addClass('hidden');
            $('#usernameError').addClass('hidden');
            $('#emailError').addClass('hidden');
            $('#passwordError').addClass('hidden');
            $('#signupBtn').prop('disabled', true);
            $('#signupLoading').removeClass('hidden');

            const registerData = {
                name: $('#name').val().trim(),
                username: $('#username').val().trim(),
                email: $('#email').val().trim(),
                password: $('#password').val()
            };

            $.ajax({
                url: `${API_BASE_URL}/register`,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(registerData),
                success: function(response) {
                    if (response.success) {
                        showMessage('Registration successful! Redirecting to login...', 'success');
                        setTimeout(() => {
                            window.location.href = '/signin';
                        }, 1500);
                    } else {
                        if (response.errors) {
                            response.errors.forEach(error => {
                                $(`#${error.field}Error`).text(error.message).removeClass('hidden');
                            });
                        } else {
                            showMessage(response.message || 'Registration failed', 'error');
                        }
                        $('#signupBtn').prop('disabled', false);
                        $('#signupLoading').addClass('hidden');
                    }
                },
                error: function(xhr) {
                    showMessage(xhr.responseJSON?.message || 'Network error during registration', 'error');
                    $('#signupBtn').prop('disabled', false);
                    $('#signupLoading').addClass('hidden');
                }
            });
        });

        $('#password').on('input', function() {
            const password = $(this).val();
            let strength = 'Weak';
            let strengthClass = 'password-strength-weak';

            if (password.length >= 12 && /[A-Z]/.test(password) && /[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password)) {
                strength = 'Strong';
                strengthClass = 'password-strength-strong';
            } else if (password.length >= 8) {
                strength = 'Moderate';
                strengthClass = 'password-strength-moderate';
            }

            $('#passwordStrengthBar')
                .removeClass('password-strength-weak password-strength-moderate password-strength-strong')
                .addClass(strengthClass);

            $('#passwordStrengthText').text(`Password strength: ${strength}`);

            // Animate width based on strength
            const width = strength === 'Strong' ? '100%' : strength === 'Moderate' ? '66%' : '33%';
            $('#passwordStrengthBar').css('width', width);
        });
    });
</script>
</body>
</html>
