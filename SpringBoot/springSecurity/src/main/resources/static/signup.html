<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - UserApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out',
                        'slide-down': 'slideDown 0.5s ease-out',
                        'slide-up': 'slideUp 0.8s ease-out',
                        'gradient-shift': 'gradientShift 8s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideDown: {
                            '0%': { transform: 'translateY(-10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        },
                        gradientShift: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #f5576c);
            background-size: 400% 400%;
            animation: gradientShift 8s ease-in-out infinite;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center">
<div class="max-w-md w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="glass-effect rounded-2xl p-8 animate-slide-up">
        <h1 class="text-3xl font-bold text-white mb-2 text-center">Join UserApp</h1>
        <p class="text-white text-opacity-80 mb-8 text-center">Create your account in seconds</p>

        <form id="signupForm" class="space-y-6">
            <div>
                <label for="name" class="block text-white text-opacity-60 text-sm font-medium">Full Name</label>
                <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        class="mt-1 w-full px-4 py-3 rounded-xl bg-white bg-opacity-10 border-0 text-white placeholder-white placeholder-opacity-60 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-50 transition-all duration-300"
                        placeholder="Enter your full name"
                >
                <p id="nameError" class="hidden text-red-300 text-sm mt-1"></p>
            </div>

            <div>
                <label for="username" class="block text-white text-opacity-60 text-sm font-medium">Username</label>
                <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        class="mt-1 w-full px-4 py-3 rounded-xl bg-white bg-opacity-10 border-0 text-white placeholder-white placeholder-opacity-60 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-50 transition-all duration-300"
                        placeholder="Choose a username"
                >
                <p id="usernameError" class="hidden text-red-300 text-sm mt-1"></p>
            </div>

            <div>
                <label for="password" class="block text-white text-opacity-60 text-sm font-medium">Password</label>
                <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="mt-1 w-full px-4 py-3 rounded-xl bg-white bg-opacity-10 border-0 text-white placeholder-white placeholder-opacity-60 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-50 transition-all duration-300"
                        placeholder="Create a password"
                >
                <p id="passwordError" class="hidden text-red-300 text-sm mt-1"></p>
                <p id="passwordStrength" class="text-white text-opacity-60 text-sm mt-1">Password strength: Weak</p>
            </div>

            <button
                    type="submit"
                    id="signupBtn"
                    class="w-full bg-white bg-opacity-20 text-white py-3 px-4 rounded-xl font-medium hover:bg-opacity-30 transition-all duration-300 flex justify-center items-center"
            >
                Create Account
                <span id="signupLoading" class="hidden ml-2">
                        <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </span>
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-white text-opacity-60">Already have an account? <a href="/signin" class="text-white font-medium hover:underline">Sign In →</a></p>
        </div>
    </div>
</div>

<div id="messageContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>

<script>
    $(document).ready(function() {
        const API_BASE_URL = 'http://localhost:8080/api/users';

        function showMessage(message, type = 'success') {
            const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            const icon = type === 'success' ?
                '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>' :
                '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>';

            const messageElement = $(`
                    <div class="message-alert ${bgColor} bg-opacity-90 text-white px-4 py-3 rounded-lg shadow-lg flex items-center animate-slide-down">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            ${icon}
                        </svg>
                        <span>${message}</span>
                        <button class="ml-4 hover:text-opacity-80">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                `);

            $('#messageContainer').append(messageElement);

            setTimeout(() => {
                messageElement.fadeOut(() => messageElement.remove());
            }, 5000);

            messageElement.find('button').click(() => {
                messageElement.fadeOut(() => messageElement.remove());
            });
        }

        $('#signupForm').submit(function(e) {
            e.preventDefault();
            $('#nameError').addClass('hidden');
            $('#usernameError').addClass('hidden');
            $('#passwordError').addClass('hidden');
            $('#signupBtn').prop('disabled', true);
            $('#signupLoading').removeClass('hidden');

            const registerData = {
                name: $('#name').val().trim(),
                username: $('#username').val().trim(),
                password: $('#password').val()
            };

            $.ajax({
                url: `${API_BASE_URL}/register`,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(registerData),
                success: function(response) {
                    if (response.success) {
                        showMessage('Registration successful! Please sign in.', 'success');
                        setTimeout(() => {
                            window.location.href = '/signin';
                        }, 1000);
                    } else {
                        showMessage(response.message || 'Registration failed', 'error');
                        $('#signupBtn').prop('disabled', false);
                        $('#signupLoading').addClass('hidden');
                    }
                },
                error: function(xhr) {
                    showMessage(xhr.responseJSON?.message || 'Network error during registration', 'error');
                    $('#signupBtn').prop('disabled', false);
                    $('#signupLoading').addClass('hidden');
                }
            });
        });

        $('#password').on('input', function() {
            const password = $(this).val();
            const strength = password.length >= 8 ? 'Strong' : password.length >= 5 ? 'Moderate' : 'Weak';
            $('#passwordStrength').text(`Password strength: ${strength}`);
        });
    });
</script>
</body>
</html>
