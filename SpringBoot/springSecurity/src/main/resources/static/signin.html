<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - UserApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        dark: {
                            900: '#0a0a0a',
                            800: '#1a1a1a',
                            700: '#2a2a2a',
                            600: '#3a3a3a',
                            500: '#4a4a4a',
                        },
                        glass: 'rgba(18, 18, 18, 0.75)'
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out',
                        'slide-down': 'slideDown 0.5s ease-out',
                        'slide-up': 'slideUp 0.8s ease-out',
                        'gradient-shift': 'gradientShift 8s ease-in-out infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideDown: {
                            '0%': { transform: 'translateY(-10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        },
                        gradientShift: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-8px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: rgba(255, 255, 255, 0.92);
        }

        .gradient-bg {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
        }

        .glass-effect {
            background: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        .btn-hover:hover {
            transform: translateY(-1px);
        }

        .auth-logo {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(168, 85, 247, 0.2) 100%);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
<div class="max-w-md w-full mx-auto animate-slide-up">
    <div class="glass-effect rounded-2xl p-8">
        <div class="flex flex-col items-center mb-8">
            <div class="w-16 h-16 auth-logo rounded-2xl flex items-center justify-center mb-4 animate-float">
                <svg class="w-8 h-8 text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2 text-center">Welcome Back</h1>
            <p class="text-white text-opacity-80 text-center">Sign in to access your dashboard</p>
        </div>

        <form id="signinForm" action="/login" method="POST" class="space-y-6">
            <div>
                <label for="username" class="block text-white text-opacity-60 text-sm font-medium mb-2">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-white text-opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                    <input
                            type="text"
                            id="username"
                            name="username"
                            required
                            class="pl-10 w-full px-4 py-3 rounded-xl bg-white bg-opacity-10 border border-white border-opacity-5 text-white placeholder-white placeholder-opacity-60 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-opacity-50 transition-all duration-300 input-focus"
                            placeholder="Enter your username"
                    >
                </div>
                <p id="usernameError" class="hidden text-red-300 text-sm mt-1"></p>
            </div>

            <div>
                <label for="password" class="block text-white text-opacity-60 text-sm font-medium mb-2">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-white text-opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                    </div>
                    <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            class="pl-10 w-full px-4 py-3 rounded-xl bg-white bg-opacity-10 border border-white border-opacity-5 text-white placeholder-white placeholder-opacity-60 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-opacity-50 transition-all duration-300 input-focus"
                            placeholder="Enter your password"
                    >
                </div>
                <p id="passwordError" class="hidden text-red-300 text-sm mt-1"></p>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 bg-white bg-opacity-10 border border-white border-opacity-20 rounded focus:ring-primary-500 focus:ring-opacity-50">
                    <label for="remember-me" class="ml-2 block text-sm text-white text-opacity-80">Remember me</label>
                </div>
                <div class="text-sm">
                    <a href="#" class="font-medium text-primary-400 hover:text-primary-300">Forgot password?</a>
                </div>
            </div>

            <button
                    type="submit"
                    id="signinBtn"
                    class="w-full bg-gradient-to-r from-primary-500 to-purple-500 text-white py-3 px-4 rounded-xl font-medium hover:opacity-90 transition-all duration-300 btn-hover flex justify-center items-center"
            >
                Sign In
                <span id="signinLoading" class="hidden ml-2">
                    <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </span>
            </button>
        </form>

        <div class="mt-8">
            <div class="relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-white border-opacity-10"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-dark-800 text-white text-opacity-60">New to UserApp?</span>
                </div>
            </div>

            <div class="mt-6">
                <a href="/signup" class="w-full inline-flex justify-center items-center px-4 py-3 rounded-xl border border-white border-opacity-20 shadow-sm text-sm font-medium text-white hover:bg-white hover:bg-opacity-5 transition-all duration-300 btn-hover">
                    Create an account
                </a>
            </div>
        </div>
    </div>
</div>

<div id="messageContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>

<script>
    $(document).ready(function() {
        function showMessage(message, type = 'success') {
            const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            const icon = type === 'success' ?
                '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>' :
                '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>';

            const messageElement = $(`
                    <div class="message-alert ${bgColor} bg-opacity-90 text-white px-4 py-3 rounded-lg shadow-lg flex items-center animate-slide-down border border-white border-opacity-20">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            ${icon}
                        </svg>
                        <span>${message}</span>
                        <button class="ml-4 hover:text-opacity-80">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                `);

            $('#messageContainer').append(messageElement);

            setTimeout(() => {
                messageElement.fadeOut(() => messageElement.remove());
            }, 5000);

            messageElement.find('button').click(() => {
                messageElement.fadeOut(() => messageElement.remove());
            });
        }

        // Display error messages from URL parameters (e.g., ?error)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error')) {
            showMessage('Invalid username or password', 'error');
        }

        // Form submission handling
        $('#signinForm').submit(function(e) {
            $('#signinBtn').prop('disabled', true);
            $('#signinLoading').removeClass('hidden');
        });
    });
</script>
</body>
</html>
